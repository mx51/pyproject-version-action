name: "PyProject Version Action"
description: "Ensures the next Git tag version in pyproject.toml aligns with label used in Pull-Request title."

inputs:
  repo-token:
    description: "A github token for API access"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v5

    # The working directory stays in the repo of the caller, so that action.py reads its pyproject.toml.
    - run: >-
        uv run --project "${{ github.action_path }}" --frozen --no-dev --python 3.14
        python "${{ github.action_path }}/action.py"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.repo-token }}
